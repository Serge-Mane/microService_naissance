name: Deploy application
run-name: ${{ github.actor }} is deploying project🚀
on:
  push:
    workflow_dispatch:
jobs:
  create-folder:
    name: create folder on server
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/serge-mane/microservice
            ls -al -p /opt/serge-mane

  build-projet:
    runs-on: ubuntu-latest
    needs: create-folder
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Setup java version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Build project
        run: |
          ./mvnw clean package spring-boot:repackage -Dmaven.test.skip=true
      - name: rename project
        run: |
          mv target/ms-naissances-*.jar target/ms-naissances.jar
      - name: Copy files on sevrer
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: target/ms-naissances.jar
          target: /opt/serge-mane/microservice
          strip_components: 1
          overwrite: true