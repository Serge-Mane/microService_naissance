name: Deploy application
run-name: ${{ github.actor }} is deploying project 🚀
on:
  push:
    workflow_dispatch:
env:
  GROUP: /opt/serge-mane
  PROJECT: ms-serge-mane
jobs:
  create-folder:
    name: create folder on server
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{env.GROUP}}/${{env.PROJECT}}
  build-projet:
    runs-on: ubuntu-latest
    needs: create-folder
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Setup java version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Build project
        run: |
          ./mvnw clean package spring-boot:repackage -Dmaven.test.skip=true
      - name: rename project
        run: |
          mv target/${{env.PROJECT}}-*.jar target/${{env.PROJECT}}.jar
      - name: Copy files on sevrer
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: target/${{env.PROJECT}}.jar
          target: ${{env.GROUP}}/${{env.PROJECT}}
          strip_components: 1
          overwrite: true
  run-project:
    name: run project on serveur
    runs-on: ubuntu-latest
    needs: build-projet
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ln -sf ${{env.GROUP}}/${{env.PROJECT}}/${{env.PROJECT}}.jar /etc/init.d/${{env.PROJECT}}
            /etc/init.d/${{env.PROJECT}} stop
             /etc/init.d/${{env.PROJECT}} start --spring.mail.host=${{secrets.MAIL_HOST}} --spring.datasource.username=${{secrets.DATABASE_USERNAME}} --spring.datasource.password=${{secrets.DATABASE_USERPASSWORD}} --spring.datasource.url=${{secrets.DATABASE_URL}} --spring.sql.init.mode=always
